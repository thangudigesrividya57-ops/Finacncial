<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MoneyMetrics Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
</head>

<body>

    <div class="auth-overlay show" id="authSignIn">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="auth-logo-icon">??</div>
                <div class="auth-logo-txt">MoneyMetrics <span>Pro</span></div>
            </div>
            <div class="auth-title">Welcome Back</div>
            <div class="auth-sub">Sign in to your financial intelligence dashboard</div>
            <div class="auth-err" id="siErr"></div>
            <div class="form-group"><label class="auth-label">Email Address</label>
                <input class="auth-input" type="email" id="siEmail" placeholder="you@example.com">
            </div>
            <div class="form-group" style="margin-top:0"><label class="auth-label">Password</label>
                <input class="auth-input" type="password" id="siPass" placeholder="Enter your password">
            </div>
            <button class="auth-btn" onclick="signIn()">Sign In <i class="fas fa-arrow-right"></i></button>
            <div class="auth-divider">OR</div>
            <button class="auth-btn" onclick="guestLogin()">Continue as Guest <i class="fas fa-user-astronaut"></i></button>
            <div class="auth-switch">Don't have an account? <a href="signup.html">Create Account</a></div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>

</html>
