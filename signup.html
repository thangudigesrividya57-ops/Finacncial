<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — MoneyMetrics Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
</head>

<body>

    <div class="auth-overlay show" id="authSignUp">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="auth-logo-icon">??</div>
                <div class="auth-logo-txt">MoneyMetrics <span>Pro</span></div>
            </div>
            <div class="auth-title">Create Account</div>
            <div class="auth-sub">Join 50,000+ users managing their finances smarter</div>
            <div class="auth-err" id="suErr"></div>
            <div class="auth-name-row">
                <div><label class="auth-label">First Name</label>
                    <input class="auth-input" id="suFirst" placeholder="Arjun">
                </div>
                <div><label class="auth-label">Last Name</label>
                    <input class="auth-input" id="suLast" placeholder="Sharma">
                </div>
            </div>
            <label class="auth-label">Email Address</label>
            <input class="auth-input" type="email" id="suEmail" placeholder="you@example.com">
            <label class="auth-label">Password</label>
            <input class="auth-input" type="password" id="suPass" placeholder="Min. 6 characters">
            <button class="auth-btn" onclick="signUp()">Create Account <i class="fas fa-rocket"></i></button>
            <div class="auth-switch">Already have an account? <a href="signin.html">Sign In</a></div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>

</html>
